        - "9"
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - trixie
        - bookworm
        - bullseye
    - name: Fedora
      versions:
        - "42"
        - "41"
        - "40"
  galaxy_tags:
    - hashicorp
    - packer
    - vagrant
    - virtualization
